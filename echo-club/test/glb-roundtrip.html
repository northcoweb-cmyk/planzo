<!doctype html>
<html><head><meta charset="utf-8"><title>GLB character round-trip</title></head>
<body style="background:#111;color:#ddd;font:14px monospace">
<pre id="out">running…</pre>
<script type="module">
  // Dev-only check: build a tiny rig from named meshes, export to GLB, re-import with the same
  // GLTFLoader the app uses, convert with GlbCharacter.convertRiggedScene and report the result.
  import * as THREE from 'three';
  import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { convertRiggedScene } from '/src/crowd/GlbCharacter.ts';

  const out = document.getElementById('out');
  try {
    const root = new THREE.Group();
    const mk = (name, w, h, d, x, y, z, color) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, name: name.includes('head') ? 'skin' : 'cloth' }));
      m.name = name; m.position.set(x, y, z); root.add(m); return m;
    };
    mk('pelvis', 0.3, 0.2, 0.2, 0, 0.92, 0, '#222');
    mk('torso_shirt', 0.36, 0.5, 0.22, 0, 1.2, 0, '#335');
    mk('head', 0.18, 0.22, 0.2, 0, 1.64, 0, '#a77');
    mk('hair', 0.2, 0.08, 0.22, 0, 1.76, 0, '#111');
    mk('upperArm_L', 0.09, 0.29, 0.09, 0.23, 1.27, 0, '#a77');
    mk('foreArm_L', 0.07, 0.26, 0.07, 0.23, 0.99, 0, '#a77');
    mk('upperArm_R', 0.09, 0.29, 0.09, -0.23, 1.27, 0, '#a77');
    mk('foreArm_R', 0.07, 0.26, 0.07, -0.23, 0.99, 0, '#a77');
    mk('thigh_L', 0.12, 0.42, 0.12, 0.09, 0.71, 0, '#224');
    mk('shin_L', 0.1, 0.42, 0.1, 0.09, 0.29, 0, '#224');
    mk('thigh_R', 0.12, 0.42, 0.12, -0.09, 0.71, 0, '#224');
    mk('shin_R', 0.1, 0.42, 0.1, -0.09, 0.29, 0, '#224');
    mk('phone', 0.07, 0.14, 0.01, -0.23, 0.8, 0.02, '#000');
    const buf = await new GLTFExporter().parseAsync(root, { binary: true });
    const gltf = await new GLTFLoader().parseAsync(buf, '');
    const geo = convertRiggedScene(gltf.scene);
    const parts = new Set(Array.from(geo.attributes.aPF.array).filter((_, i) => i % 2 === 0));
    const flags = new Set(Array.from(geo.attributes.aPF.array).filter((_, i) => i % 2 === 1));
    const res = {
      ok: true,
      glbBytes: buf.byteLength,
      vertices: geo.attributes.position.count,
      attributes: Object.keys(geo.attributes).sort(),
      parts: [...parts].sort((a, b) => a - b),
      flags: [...flags].sort((a, b) => a - b),
      sampleShoulderPivotA: Array.from(geo.attributes.aPivotA.array.slice(0, 3)).map((v) => +v.toFixed(2)),
    };
    out.textContent = JSON.stringify(res);
    document.title = 'DONE ' + JSON.stringify(res);
  } catch (e) {
    out.textContent = 'ERROR ' + e.message;
    document.title = 'ERROR ' + e.message;
  }
</script></body></html>
